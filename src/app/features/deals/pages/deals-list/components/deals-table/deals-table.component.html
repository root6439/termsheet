<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource()" matSort>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="purchasePrice">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
      <td mat-cell *matCellDef="let row">{{ row.purchasePrice | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Address</th>
      <td mat-cell *matCellDef="let row">{{ row.address }}</td>
    </ng-container>

    <ng-container matColumnDef="noi">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOI</th>
      <td mat-cell *matCellDef="let row">{{ row.noi | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="capRate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cap Rate</th>
      <td mat-cell *matCellDef="let row">{{ row.capRate }}%</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
</div>
