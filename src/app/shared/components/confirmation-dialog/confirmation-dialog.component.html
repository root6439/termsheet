<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  {{ message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-button [mat-dialog-close]="true" [color]="confirmButtonColor">
    {{ confirmButtonLabel }}
  </button>
</mat-dialog-actions>
